<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | Celevora</title>

<meta name="description" content="Create your Celevora account and start planning unforgettable events.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="celevora-mobile-responsive.css">
</head>

<body>

<header class="site-header">
    <div class="container navbar">
        <a href="index.html" class="logo">
            <span class="logo-mark">C</span>
            <span class="logo-text">Celevora</span>
        </a>
    </div>
</header>

<main>

<section class="register-section">

    <div class="container">

        <div class="register-wrapper">

            <div class="register-left">
                <h1>Create Your Account</h1>

                <p>
                    Join Celevora and discover amazing events,
                    vendors, venues and unforgettable experiences.
                </p>

                <div class="register-benefits">
                    <div>✓ Save Favourite Events</div>
                    <div>✓ Book Vendors Easily</div>
                    <div>✓ Manage Bookings</div>
                    <div>✓ Get Exclusive Offers</div>
                </div>
            </div>

            <div class="register-card">

                <h2>Sign Up</h2>

                <form id="registerForm">

                    <div class="form-group">
                        <label>Full Name</label>
                        <input
                            type="text"
                            placeholder="Enter your full name"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Email Address</label>
                        <input
                            type="email"
                            placeholder="Enter your email"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Phone Number</label>
                        <input
                            type="tel"
                            placeholder="Enter phone number"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input
                            type="password"
                            placeholder="Create password"
                            required>
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>
                        <input
                            type="password"
                            placeholder="Confirm password"
                            required>
                    </div>

                    <label class="terms-check">
                        <input type="checkbox" required>
                        I agree to the Terms & Conditions and Privacy Policy
                    </label>

                    <button type="submit" class="btn btn-primary register-btn">
                        Create Account
                    </button>

                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <div class="social-login">

                    <button class="social-btn">
                        Continue with Google
                    </button>

                    <button class="social-btn">
                        Continue with Facebook
                    </button>

                </div>

                <div class="login-link">
                    Already have an account?
                    <a href="login.html">Login</a>
                </div>

            </div>

        </div>

    </div>

</section>

</main>

<footer class="site-footer">
    <div class="container">
        <div class="footer-bottom">
            <p>© 2026 Celevora. All Rights Reserved.</p>
        </div>
    </div>
</footer>

<script src="assets/js/main.js"></script>

</body>
</html>
